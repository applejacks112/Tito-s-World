<!DOCTYPE html><html><head><style>body { background: #f0f0f0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; } .board { display: grid; grid-template-columns: repeat(8, 50px); grid-template-rows: repeat(8, 50px); border: 5px solid #333; } .square { width: 50px; height: 50px; } .light { background: #eee; } .dark { background: #888; } </style></head><body><div class="board"></div><script>const board = document.querySelector('.board'); for(let i=0; i<64; i++) { const sq = document.createElement('div'); sq.className = 'square ' + ((Math.floor(i/8)+i)%2===0 ? 'light' : 'dark'); board.appendChild(sq); }</script></body></html>
