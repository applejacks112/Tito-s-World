<html><head><style>body{background:#f0e4d7; font-family:sans-serif;} .board{display:grid; grid-template-columns:repeat(8, 40px); grid-template-rows:repeat(8, 40px); border:2px solid #5d4037;} .cell{width:40px; height:40px;} .white{background:#fff;} .black{background:#8b4513;}</style></head><body><div class='board'><script>for(let i=0; i<64; i++){let div=document.createElement('div'); div.className='cell ' + ((Math.floor(i/8)+i)%2==0 ? 'white' : 'black'); document.querySelector('.board').appendChild(div);}</script></div></body></html>
