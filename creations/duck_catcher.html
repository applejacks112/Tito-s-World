<!DOCTYPE html>
<html>
<head>
<title>Duck Catcher Game</title>
<style>
body { background-color: #e0f7fa; font-family: sans-serif; text-align: center; padding: 50px; }
h1 { color: #00796b; }
#game-area { width: 400px; height: 300px; background: #81d4fa; margin: 20px auto; position: relative; overflow: hidden; border: 4px solid #004d40; border-radius: 12px; }
#duck { width: 50px; height: 50px; background: yellow; border-radius: 50%; position: absolute; top: 100px; left: 100px; cursor: pointer; text-align: center; line-height: 50px; font-size: 24px; }
</style>
</head>
<body>
<h1>Catch the Quacking Duck!</h1>
<p>Score: <span id="score">0</span></p>
<div id="game-area">
  <div id="duck" onclick="catchDuck()">🦆</div>
</div>
<script>
let score = 0;
function catchDuck() {
  score++;
  document.getElementById('score').innerText = score;
  let x = Math.floor(Math.random() * 350);
  let y = Math.floor(Math.random() * 250);
  let duck = document.getElementById('duck');
  duck.style.left = x + 'px';
  duck.style.top = y + 'px';
}
</script>
</body>
</html>
