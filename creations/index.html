<!DOCTYPE html><html><head><style>body { transition: background 0.5s; font-family: sans-serif; text-align: center; padding: 50px; } #quack-btn { padding: 15px 30px; font-size: 20px; cursor: pointer; } #quack-btn:hover { background-color: yellow; }</style></head><body><h1>Welcome to Tito's World!</h1><button id="quack-btn" onclick="alert('Quack!')">Hover over me!</button><script>document.getElementById('quack-btn').addEventListener('mouseover', function() { document.body.style.backgroundColor = 'lightblue'; }); document.getElementById('quack-btn').addEventListener('mouseout', function() { document.body.style.backgroundColor = 'white'; });</script></body></html>
