<!DOCTYPE html><html><head><style>.board{display:grid;grid-template-columns:repeat(8,50px);grid-template-rows:repeat(8,50px);border:5px solid #333}.cell{width:50px;height:50px}.white{background:#eee}.black{background:#555}</style></head><body><h1>My Chess Practice Board</h1><div class='board' id='board'></div><script>const board=document.getElementById('board');for(let i=0;i<64;i++){const cell=document.createElement('div');cell.className='cell ' + ((Math.floor(i/8)+i%8)%2===0?'white':'black');board.appendChild(cell);}</script></body></html>
