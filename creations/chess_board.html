<div id='board'></div><style>#board { display: grid; grid-template-columns: repeat(8, 40px); grid-template-rows: repeat(8, 40px); } .square { width: 40px; height: 40px; } .light { background: #eee; } .dark { background: #888; }</style><script>const board = document.getElementById('board'); for(let i=0; i<64; i++) { const s = document.createElement('div'); s.className = 'square ' + ((Math.floor(i/8) + i) % 2 === 0 ? 'light' : 'dark'); board.appendChild(s); }</script>
